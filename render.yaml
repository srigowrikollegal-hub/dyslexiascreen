services:
  - type: web
    name: dyslexiascreen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dyslexiascreen-db
          property: connectionString
databases:
  - name: dyslexiascreen-db
    plan: free
    databaseName: dyslexiascreen
    user: dyslexiascreen
